[project]
name = "jafar-legal-ai-agent"
version = "0.3.1"
description = "Jafar AI legal agent: document analysis, email triage, voice workflows and legal work automation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "httpx>=0.28,<1",
  "supabase>=2.15,<3",
  "openai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/jafar"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
