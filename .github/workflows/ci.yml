name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - feat/ai-council-qwen-kimi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Python quality gate
        run: bash ci/run-python-gate.sh
