name: Jafar Apple

on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - main
      - feat/ai-council-qwen-kimi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Apple build gate
        run: bash ci/run-apple-gate.sh
