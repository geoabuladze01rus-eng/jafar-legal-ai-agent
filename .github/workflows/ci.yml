name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - release/jafar-2.0-consolidation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Compile sources
        run: python -m compileall -q src
      - name: Pytest
        run: pytest -q
