name: Jafar Apple

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "codex/jafar-canonical-v2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate --spec project.yml
      - name: Verify generated project
        run: test -d apple/JafarApp.xcodeproj
      - name: Show available Xcode targets and schemes
        run: xcodebuild -project apple/JafarApp.xcodeproj -list
      - name: Build iOS Simulator
        run: |
          xcodebuild -project apple/JafarApp.xcodeproj -target JafarApp_iOS \
            -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS
        run: |
          xcodebuild -project apple/JafarApp.xcodeproj -target JafarApp_macOS \
            -sdk macosx -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
