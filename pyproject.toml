[project]
name = "jafar-legal-ai-agent"
version = "0.13.0"
description = "Jafar AI legal agent: document analysis, email triage, voice workflows and legal work automation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "httpx>=0.28,<1",
  "supabase>=2.15,<3",
  "openai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
docling = ["docling>=2.118,<3"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep the project baseline stable across Ruff releases; stricter rule families are introduced deliberately.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jafar*"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
