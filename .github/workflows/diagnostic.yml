name: Diagnostic

on:
  workflow_dispatch:
  push:
    branches: ['feature/**']

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        run: python --version
      - name: Pip
        run: python -m pip --version
      - name: Repository layout
        run: |
          pwd
          ls -la
          test -f pyproject.toml
          test -d src/jafar
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Import package
        run: python -c "import jafar; print('jafar import OK')"
      - name: Test discovery
        run: pytest --collect-only -q
