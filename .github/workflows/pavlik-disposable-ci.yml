name: Pavlik Disposable Acceptance CI

on:
  push:
    branches: [codex/pavlik-disposable-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pavlik-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jafar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jafar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jafar_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'select version();'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create schema if not exists acceptance_test;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select current_database(), current_user;"

      - name: Ruff
        run: ruff check src tests

      - name: Compile sources
        run: python -m compileall -q src

      - name: Pavlik acceptance contract
        run: pytest -q tests/test_pavlik_acceptance_contract.py

      - name: Full Python regression suite
        run: pytest -q

      - name: Confirm no production credentials are required
        run: |
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          echo 'Disposable acceptance CI completed without production secrets.'
