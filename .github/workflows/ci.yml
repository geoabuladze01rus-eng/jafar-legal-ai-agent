name: Jafar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project specification
        run: |
          test -f apple/project.yml
          test -f apple/JafarApp/Info.plist
          test -f apple/JafarApp/JafarApp.swift
      - name: Validate Swift sources
        shell: bash
        run: |
          files=$(find apple/JafarApp -name '*.swift' -type f)
          test -n "$files"
          echo "$files"
          while IFS= read -r file; do
            test -s "$file"
          done <<< "$files"
