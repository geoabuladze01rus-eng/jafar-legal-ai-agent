name: CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests with diagnostics
        run: |
          set -o pipefail
          pytest -vv 2>&1 | tee pytest.log
      - name: Publish test diagnostics
        if: always()
        run: |
          echo '## pytest diagnostics' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 pytest.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
