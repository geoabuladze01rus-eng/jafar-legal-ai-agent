name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify package import
        run: python -c "import jafar; print('jafar import OK')"
      - name: Run tests with diagnostics
        run: |
          set -o pipefail
          pytest -vv 2>&1 | tee pytest.log
      - name: Publish test diagnostics
        if: always()
        run: |
          echo '## pytest diagnostics' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 pytest.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
