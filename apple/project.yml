name: JafarApp
options:
  bundleIdPrefix: ru.jafar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  JafarApp:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: JafarApp
    info:
      path: JafarApp/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Джафар использует микрофон для голосовых команд."
        NSSpeechRecognitionUsageDescription: "Джафар использует распознавание речи для выполнения голосовых команд."
        NSLocalNetworkUsageDescription: "Джафар подключается к локальному серверу на вашем Mac для приватной Beta-проверки."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.jafar.legal-ai
        PRODUCT_NAME: Jafar
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Джафар использует распознавание речи для голосового управления."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Джафар использует микрофон для голосовых команд."
