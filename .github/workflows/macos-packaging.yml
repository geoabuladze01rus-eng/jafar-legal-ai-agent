name: JAFAR macOS Packaging

on:
  pull_request:
    branches:
      - main
      - integration/jafar-2.1-canonical
      - feature/jafar-2.1-case-evidence-gap-draft
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install packaging toolchain
        run: brew install python@3.12 xcodegen
      - name: Build unsigned arm64 beta package
        run: |
          BUILD_PYTHON="$(brew --prefix python@3.12)/bin/python3.12"
          test -x "$BUILD_PYTHON"
          JAFAR_BUILD_PYTHON="$BUILD_PYTHON" ./scripts/build_macos_release.sh
      - name: Verify packaging output is ignored
        run: git status --short --ignored dist/macos
      - name: Verify the app icon
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/justicia-premium-workspace-avatar' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          app="dist/macos/Юстиция.app/Contents"
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Info.plist")"
          test "$icon" = Justicia.icns
          test -s "$app/Resources/$icon"
      - name: Attach unsigned beta installer
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/justicia-premium-workspace-avatar' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: Justicia-macOS-arm64-beta
          path: |
            dist/macos/*.dmg
            dist/macos/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
