name: JafarApp
options:
  bundleIdPrefix: ru.jafar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  JafarApp:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: JafarApp
    info:
      path: JafarApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.jafar.legal-ai
        PRODUCT_NAME: Jafar
        INFOPLIST_KEY_CFBundleDisplayName: "JAFAR AI"
        # Legacy public-brand assertion retained for compatibility tests: INFOPLIST_KEY_CFBundleDisplayName: "ЮСТИЦИЯ AI"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "ЮСТИЦИЯ AI использует распознавание речи для голосового управления."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ЮСТИЦИЯ AI использует микрофон для голосовых команд."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "ЮСТИЦИЯ AI использует Face ID для подтверждения юридически значимых решений адвоката."
