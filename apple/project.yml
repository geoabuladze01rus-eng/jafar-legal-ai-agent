name: JafarApp
options:
  bundleIdPrefix: ru.jafar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  JafarApp:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: JafarApp
    info:
      path: JafarApp/Info.plist
      properties:
        CFBundleDisplayName: "Юстиция"
        CFBundleName: "Юстиция"
        CFBundleShortVersionString: "2.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "«Юстиция» использует микрофон для голосовых команд и транскрибации."
        NSSpeechRecognitionUsageDescription: "«Юстиция» использует распознавание речи для голосовых команд и транскрибации."
        JAFARCommandEndpoint: "$(JAFAR_COMMAND_ENDPOINT)"
        JAFARUserId: "$(JAFAR_USER_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.jafar.legal-ai
        PRODUCT_NAME: Jafar
        ENABLE_HARDENED_RUNTIME: "YES"
